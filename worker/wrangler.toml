name = "sphere-api"
main = "src/final.ts"
compatibility_date = "2026-09-09"

[vars]
# Accept the canonical custom domain plus the Netlify fallback hostname.
# www.spheres.ng.com redirects to the canonical spheres.com.ng domain.
FRONTEND_ORIGIN = "https://spheres.com.ng,https://www.spheres.com.ng,https://sphereis.netlify.app"

[[d1_databases]]
binding = "DB"
database_name = "sphere"
database_id = "4de71dc8-fd19-44c2-994f-e5c0dbbf4dc2"

[[r2_buckets]]
binding = "R2"
bucket_name = "spheresocial"

[secrets]
required = ["JWT_SECRET", "JWT_REFRESH_SECRET"]
