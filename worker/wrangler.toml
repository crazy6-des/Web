name = "sphere-api"
main = "src/entry.ts"
compatibility_date = "2026-09-09"
keep_vars = true

[vars]
# Canonical production frontend origin. The www hostname redirects to this apex domain.
FRONTEND_ORIGIN = "https://spheres.com.ng"
# Additional browser origins that may legitimately load the same production frontend.
FRONTEND_ORIGINS = "https://spheres.com.ng,https://sphereis.netlify.app"
# Reward policy: provider gross payout is split 75% user / 25% platform.
REWARD_USER_SHARE_PERCENT = "75"
# Canonical hosted CPAlead/CDNFlyer reward wall. The Worker appends the authenticated Sphere user ID as subid.
CPALEAD_OFFERWALL_URL = "https://www.cdnflyer.com/wall/vekoIu9"

[[d1_databases]]
binding = "DB"
database_name = "sphere"
database_id = "4de71dc8-fd19-44c2-994f-e5c0dbbf4dc2"

[[r2_buckets]]
binding = "R2"
bucket_name = "spheresocial"

[secrets]
required = ["JWT_SECRET", "JWT_REFRESH_SECRET"]
