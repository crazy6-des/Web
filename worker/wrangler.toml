name = "sphere-api"
main = "src/index.ts"
compatibility_date = "2026-09-09"

[[d1_databases]]
binding = "DB"
database_name = "sphere"
# Keep the existing production database_id in Cloudflare/Wrangler configuration.
# Do not create or replace the database.

disable_trigger_auto_update = true

[[r2_buckets]]
binding = "R2"
bucket_name = "sphere"

[vars]
# Non-secret runtime configuration only. Secrets stay in Cloudflare.
