name: production deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align reward status enums, CPAlead offer FK, and wallet points fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/src/rewards.ts')
          s=p.read_text()
          replacements={
            "type:'credit',status:'approved',state:'approved'":"type:'credit',status:'APPROVED',state:'approved'",
            "provider,provider_name:provider,event_type:'offerwall',user_id:userId,offer_id:offerId,status:'accepted',state:'accepted'":"provider,provider_name:provider,event_type:'offerwall',user_id:userId,offer_id:offerId,status:'APPROVED',state:'accepted'",
            "const offerId=clean(b.offer_id||b.offerid||b.campaign_id)||undefined;":"const offerId=provider==='cpalead'?undefined:(clean(b.offer_id||b.offerid||b.campaign_id)||undefined);",
            "wallet_id:wid,user_id:userId,type:'reward',transaction_type:'reward',direction:'credit',amount,balance_after:next":"wallet_id:wid,user_id:userId,type:'reward',transaction_type:'reward',direction:'credit',amount,amount_points:amount,balance_after:next"
          }
          for old,new in replacements.items():
              if old in s:
                  s=s.replace(old,new,1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- worker/src/rewards.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add worker/src/rewards.ts
            git commit -m 'Fix wallet transaction points field for rewards'
            git push origin HEAD:main
          fi
      - name: Expose D1 reward commit error for controlled diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/src/rewards.ts')
          s=p.read_text()
          old="catch{return {ok:false,status:409,error:'Reward event could not be committed'}}"
          new="catch(e){const detail=e instanceof Error?e.message:String(e);return {ok:false,status:409,error:`Reward event could not be committed: ${detail}`}}"
          if old not in s:
              raise SystemExit('diagnostic target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Ensure required Worker JWT secrets exist
        shell: bash
        run: |
          set -euo pipefail
          cd worker
          SECRETS="$(npx wrangler@4 secret list 2>/dev/null || true)"
          if ! printf '%s' "$SECRETS" | grep -q '"name": "JWT_SECRET"'; then
            printf '%s' "$(openssl rand -hex 48)" | npx wrangler@4 secret put JWT_SECRET
          fi
          if ! printf '%s' "$SECRETS" | grep -q '"name": "JWT_REFRESH_SECRET"'; then
            printf '%s' "$(openssl rand -hex 48)" | npx wrangler@4 secret put JWT_REFRESH_SECRET
          fi
      - run: npm install
        working-directory: worker
      - run: npm run check
        working-directory: worker
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      - name: Verify production signup and D1-backed session
        shell: bash
        run: |
          set -euo pipefail
          cd worker
          npm install
          node scripts/production-auth-smoke.mjs
