name: production deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure required Worker JWT secrets exist
        shell: bash
        run: |
          set -euo pipefail
          cd worker
          SECRETS="$(npx wrangler@4 secret list 2>/dev/null || true)"
          if ! printf '%s' "$SECRETS" | grep -q '"name": "JWT_SECRET"'; then
            printf '%s' "$(openssl rand -hex 48)" | npx wrangler@4 secret put JWT_SECRET
          fi
          if ! printf '%s' "$SECRETS" | grep -q '"name": "JWT_REFRESH_SECRET"'; then
            printf '%s' "$(openssl rand -hex 48)" | npx wrangler@4 secret put JWT_REFRESH_SECRET
          fi
      - run: npm install
        working-directory: worker
      - run: npm run check
        working-directory: worker
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      - name: Verify production signup and D1-backed session
        shell: bash
        run: |
          set -euo pipefail
          cd worker
          npm install
          node scripts/production-auth-smoke.mjs
