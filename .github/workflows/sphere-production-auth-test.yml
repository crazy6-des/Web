name: sphere-production-auth-test
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy existing Worker
        run: |
          cd worker
          npm install
          npm run check
          npx wrangler@4 deploy
      - name: Test production signup and remote D1 persistence
        run: |
          set -e
          USERNAME="incident${GITHUB_RUN_ID}"
          EMAIL="incident-${GITHUB_RUN_ID}@example.invalid"
          PASSWORD="SphereIncident-${GITHUB_RUN_ID}-Safe!"
          curl -sS -D /tmp/signup.headers -o /tmp/signup.json -X POST 'https://sphere-api.binancecompany274.workers.dev/auth/signup' -H 'content-type: application/json' --data "{\"username\":\"$USERNAME\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}"
          echo '--- signup status ---'
          grep -i '^HTTP/' /tmp/signup.headers | tail -1
          echo '--- signup response ---'
          cat /tmp/signup.json
          echo
          cd worker
          npx wrangler@4 d1 execute sphere --remote --command "SELECT id,username,role,status FROM users WHERE username='$USERNAME'"
          npx wrangler@4 d1 execute sphere --remote --command "SELECT COUNT(*) AS n FROM users WHERE username='$USERNAME'"
