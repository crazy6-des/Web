name: apply-message-ui-fixes-v2
on:
  push:
    branches: [fix/message-music-ui]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/message-music-ui
          fetch-depth: 1
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('src/App.tsx');s=app.read_text()
          create='''function Create({onCreated}:{onCreated:()=>void}){const[file,setFile]=useState<File|null>(null);const[caption,setCaption]=useState('');const[music,setMusic]=useState('');const[selectedMusic,setSelectedMusic]=useState<Music|undefined>();const[musicResults,setMusicResults]=useState<Music[]>([]);const[musicBusy,setMusicBusy]=useState(false);const[busy,setBusy]=useState(false);const[error,setError]=useState('');const preview=useMemo(()=>file?URL.createObjectURL(file):'', [file]);useEffect(()=>()=>{if(preview)URL.revokeObjectURL(preview)},[preview]);useEffect(()=>{const q=music.trim();if(q.length<2){setMusicResults([]);setMusicBusy(false);return}let cancelled=false;const timer=window.setTimeout(async()=>{setMusicBusy(true);try{const r=await api.musicSearch(q);if(!cancelled)setMusicResults(r.tracks||[])}catch{if(!cancelled)setMusicResults([])}finally{if(!cancelled)setMusicBusy(false)}},300);return()=>{cancelled=true;window.clearTimeout(timer)}},[music]);async function submit(e:FormEvent){e.preventDefault();if(!file)return setError('Choose an image first.');setBusy(true);setError('');try{const uploaded=await api.uploadImage(file);const musicData=selectedMusic||(music.trim()?{provider:'manual-metadata',title:music.trim()}:undefined);await api.createPost({caption,music:musicData,imageKey:uploaded.key});onCreated()}catch(e){setError(e instanceof Error?e.message:'Unable to create post')}finally{setBusy(false)}}return <section><Heading eyebrow="Publish" title="Create"/><form className="composer" onSubmit={submit}><label>Image<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" onChange={e=>setFile(e.target.files?.[0]||null)} required/></label>{preview&&<img className="preview" src={preview} alt="Selected preview"/>}<label>Caption<textarea value={caption} onChange={e=>setCaption(e.target.value)} maxLength={2200} placeholder="Say something…"/></label><div className="music-picker"><label>Song (optional)<input value={music} onChange={e=>{setMusic(e.target.value);setSelectedMusic(undefined)}} placeholder="Search song or artist" autoComplete="off"/></label>{musicBusy&&<div className="muted music-status">Searching live music catalog…</div>}{!musicBusy&&music.trim().length>=2&&!musicResults.length&&<div className="muted music-status">No music matches found.</div>}{selectedMusic&&<div className="music-selected"><span>♫ {selectedMusic.title}{selectedMusic.artist?` — ${selectedMusic.artist}`:''}</span><button type="button" className="quiet-button" onClick={()=>setSelectedMusic(undefined)}>Clear</button></div>}{musicResults.length>0&&<div className="results music-results">{musicResults.map((m:Music)=><button type="button" className="result music-result" key={m.id||`${m.title}-${m.artist}`} onClick={()=>{setMusic(`${m.title||''}${m.artist?` — ${m.artist}`:''}`);setSelectedMusic(m);setMusicResults([])}}><strong>{m.title||'Untitled'}</strong><span className="muted">{m.artist||'Unknown artist'}{m.album?` · ${m.album}`:''}</span></button>)}</div>}<p className="muted">Search is live and the selected track is saved with the post. For openly licensed audio, <a href="https://openverse.org/audio/" target="_blank" rel="noreferrer">Openverse Audio</a> is an open media search source; verify each track's license.</p></div>{error&&<div className="error">{error}</div>}<button className="primary" disabled={busy}>{busy?'Publishing…':'Publish image'}</button><p className="muted">Sphere stores music metadata with the post; it does not download copyrighted music.</p></form></section>}\n'''
          pat=r"function Create\(\{onCreated\}:\{onCreated:\(\)=>void\}\)\{.*?\}\nfunction Earn"
          s2=re.sub(pat,lambda _:create+"function Earn",s,count=1,flags=re.S)
          if s2==s: raise SystemExit('Create replacement failed')
          s=s2
          messages='''function messageDate(value: unknown) {if (value===null||value===undefined||value==='') return '';let d:Date;if(typeof value==='number'){d=new Date(value<1e12?value*1000:value)}else{const raw=String(value).trim();if(/^\d+$/.test(raw)){const n=Number(raw);d=new Date(n<1e12?n*1000:n)}else{const normalized=raw.includes('T')?raw:raw.replace(' ','T');d=new Date(normalized.endsWith('Z')?normalized:normalized+'Z')}}return Number.isNaN(d.getTime())?'':d.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}\nfunction Messages({targetUser,conversationId}:{targetUser:User|null;conversationId?:string}){const[target,setTarget]=useState(targetUser?.id||'');const[conversation,setConversation]=useState(conversationId||'');const[messages,setMessages]=useState<Message[]>([]);const[textValue,setText]=useState('');const[busy,setBusy]=useState(false);const[loadingHistory,setLoadingHistory]=useState(false);const[selectedId,setSelectedId]=useState<string|null>(null);const[editing,setEditing]=useState(false);const[editValue,setEditValue]=useState('');const[imageBusy,setImageBusy]=useState(false);const[blockBusy,setBlockBusy]=useState(false);const[fileInputId]=useState(()=>`message-image-${Math.random().toString(36).slice(2)}`);useEffect(()=>{setTarget(targetUser?.id||'');setConversation(conversationId||'');setMessages([]);setSelectedId(null);setEditing(false);setEditValue('')},[targetUser?.id,conversationId]);useEffect(()=>{let cancelled=false;async function load(){if(!target)return;setLoadingHistory(true);try{let cid=conversation||'';if(!cid){const r=await api.conversationWith(target);cid=r.conversation_id||'';if(cid&&!cancelled)setConversation(cid)}if(cid){const r=await api.messages(cid);if(!cancelled)setMessages(r.messages||[]);await api.readMessages(cid).catch(()=>{})}else if(!cancelled)setMessages([])}catch{if(!cancelled)setMessages([])}finally{if(!cancelled)setLoadingHistory(false)}}load();return()=>{cancelled=true}},[target,conversation]);async function refresh(cid:string){const r=await api.messages(cid);setMessages(r.messages||[]);await api.readMessages(cid).catch(()=>{})}async function send(content=textValue){const value=content.trim();if(!target||!value||busy)return;setBusy(true);try{const r=await api.sendMessage(target,value);setConversation(r.conversation_id);setText('');setSelectedId(null);await refresh(r.conversation_id)}catch(e){alert(e instanceof Error?e.message:'Unable to send message')}finally{setBusy(false)}}async function sendImage(file:File){if(!target||imageBusy)return;setImageBusy(true);try{const uploaded=await api.uploadImage(file);await send(`[sphere-image]${uploaded.key}`)}catch(e){alert(e instanceof Error?e.message:'Unable to send image')}finally{setImageBusy(false)}}function beginEdit(){const m=messages.find(x=>String(x.id||x.message_id)===selectedId);if(!m)return;const raw=String(m.content||m.body||'');if(raw.startsWith('[sphere-image]'))return;setEditValue(raw);setEditing(true)}async function saveEdit(){const value=editValue.trim();if(!selectedId||!value)return;try{await api.editMessage(selectedId,value);if(conversation)await refresh(conversation);setEditing(false);setEditValue('');setSelectedId(null)}catch(e){alert(e instanceof Error?e.message:'Unable to edit message')}}async function toggleBlock(){if(!target||blockBusy)return;setBlockBusy(true);try{const r=await api.block(target);if(r.active){setText('');setMessages([]);setConversation('');setSelectedId(null);setEditing(false)}alert(r.active?'User blocked.':'User unblocked.')}catch(e){alert(e instanceof Error?e.message:'Unable to update block state')}finally{setBlockBusy(false)}}return <section className="messages-screen"><Heading eyebrow="Private" title={targetUser?`@${targetUser.username}`:'Messages'}>{targetUser&&<button className="quiet-button" onClick={toggleBlock} disabled={blockBusy}>{blockBusy?'Updating…':'Block / unblock'}</button>}</Heading>{!targetUser?<Empty title="Choose a user to start a conversation" text="Search for someone and send them a message."/>:<><div className="message-toolbar"><span className="muted">{selectedId?(editing?'Editing your message':'Your message selected'):'Tap one of your messages to select it'}</span>{selectedId&&!editing&&<button className="quiet-button" onClick={beginEdit}>Edit selected</button>}{editing&&<div className="message-edit-actions"><button className="quiet-button" onClick={()=>{setEditing(false);setEditValue('');setSelectedId(null)}}>Cancel</button><button className="primary small" onClick={saveEdit} disabled={!editValue.trim()}>Save edit</button></div>}</div>{editing&&<div className="message-edit-box"><textarea value={editValue} onChange={e=>setEditValue(e.target.value)} maxLength={4000} autoFocus/><div className="muted">Only your own text messages can be edited. Changes are saved to Sphere.</div></div>}<div className="message-list">{loadingHistory?<Empty title="Loading conversation…"/>:conversation&&messages.length?messages.map((m,i)=>{const id=String(m.id||m.message_id||i);const timestamp=messageDate(m.created_at||m.timestamp||m.createdAt);const mine=String(m.sender_id||'')!==String(targetUser.id);const raw=String(m.content||m.body||'');const imageKey=raw.startsWith('[sphere-image]')?raw.slice(14):'';return <div className={`message${mine?' message-mine':''}${selectedId===id?' message-selected':''}`} key={id} onClick={()=>{if(mine&&!imageKey){setSelectedId(id);if(editing){setEditing(false);setEditValue('')}}else if(!mine){setSelectedId(null)}}} role={mine?'button':undefined} tabIndex={mine?0:undefined} onKeyDown={e=>{if(mine&&!imageKey&&(e.key==='Enter'||e.key===' ')){e.preventDefault();setSelectedId(id)}}}><strong>{mine?'You':m.sender_username?`@${m.sender_username}`:'User'}</strong>{imageKey?<img className="message-image" src={`${base()}/media/${encodeURIComponent(imageKey)}`} alt="Message attachment"/>:<span>{raw}</span>}<small className="muted">{timestamp}{m.updated_at?' · edited':''}</small></div>}):conversation?<Empty title="No messages yet" text="Send the first message below."/>:<Empty title="Start the conversation" text={`No existing conversation was found for @${targetUser.username}. Send a message to create one.`}/>}</div><div className="composer message-composer"><label>Message<textarea value={textValue} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}} maxLength={4000} placeholder={`Message @${targetUser.username}…`}/></label><div className="message-compose-actions"><label htmlFor={fileInputId} className="quiet-button">{imageBusy?'Uploading…':'Add image'}</label><input id={fileInputId} type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden onChange={e=>{const f=e.target.files?.[0];if(f)sendImage(f);e.currentTarget.value=''}}/><button className="primary" onClick={()=>send()} disabled={busy||!target||!textValue.trim()}>{busy?'Sending…':'Send'}</button></div></div></>}</section>}\n'''
          s3=re.sub(r"function messageDate\(.*?function Messages\(.*",lambda _:messages,s,count=1,flags=re.S)
          if s3==s: raise SystemExit('Messages replacement failed')
          app.write_text(s3)
          css=Path('src/styles.css');c=css.read_text();c+='''\n.message-composer label > textarea { display:block; }\n.message-compose-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; }\n.message-image { display:block; width:auto; max-width:min(280px,100%); max-height:360px; object-fit:contain; border-radius:10px; border:1px solid #29292f; background:#09090b; }\n.message-mine { align-self:flex-end; border-radius:14px 14px 5px 14px; }\n.message-selected { border-color:#66666e; box-shadow:0 0 0 1px #66666e; }\n.message-toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:42px; margin-bottom:8px; padding:8px 0; border-bottom:1px solid #202025; }\n.message-edit-actions { display:flex; align-items:center; gap:8px; }\n.message-edit-box { display:grid; gap:7px; margin-bottom:10px; padding:10px; border:1px solid #2a2a30; border-radius:10px; background:#111114; }\n.message-edit-box textarea { min-height:72px; }\n.music-picker { display:grid; gap:8px; }\n.music-status { min-height:18px; }\n.music-results { max-height:280px; overflow-y:auto; }\n.music-result { display:grid; grid-template-columns:1fr auto; align-items:center; gap:12px; }\n.music-result .muted { text-align:right; }\n.music-selected { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border:1px solid #29292f; border-radius:9px; background:#111114; color:#dddde2; font-size:13px; }\n@media (max-width:560px){.message-compose-actions{gap:6px}.message-image{max-width:240px;max-height:300px}.music-result{grid-template-columns:1fr;gap:3px}.music-result .muted{text-align:left}}\n''';css.write_text(c)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles.css
          git diff --cached --quiet || git commit -m "fix: polish messaging and live music search"
          git push origin fix/message-music-ui
