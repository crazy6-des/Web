name: sphere-secret-name-check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sphere-secret-name-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required Worker secret names only
        run: |
          cd worker
          npx wrangler@4 secret list
