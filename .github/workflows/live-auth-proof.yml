name: live auth proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-auth:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API: https://sphere-api.binancecompany274.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
        working-directory: worker
      - name: Live signup, D1 persistence, login and session
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date +%s)
          USERNAME="liveproof_${TS}"
          EMAIL="liveproof_${TS}@example.invalid"
          PASSWORD='SphereLiveProof!2026x'
          signup_code=$(curl -sS -o signup.json -w '%{http_code}' -c cookies.txt -H 'content-type: application/json' -X POST "$API/auth/signup" --data "{\"username\":\"$USERNAME\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          echo "signup_http=$signup_code"
          test "$signup_code" = 201
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('signup.json','utf8')); if(!j.user?.id) process.exit(1); console.log('signup_user_id_present=true')"
          d1_json=$(npx wrangler d1 execute sphere --remote --command "SELECT COUNT(*) AS n FROM users WHERE username='$USERNAME' AND email='$EMAIL';" --json)
          echo "$d1_json" | grep -Eq '"n"[[:space:]]*:[[:space:]]*1'
          echo 'd1_user_count=1'
          session_code=$(curl -sS -o session.json -w '%{http_code}' -b cookies.txt "$API/auth/session")
          echo "session_after_signup_http=$session_code"
          test "$session_code" = 200
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('session.json','utf8')); if(j.user?.username!=='$USERNAME') process.exit(1); console.log('session_persisted=true')"
          rm -f cookies.txt signup.json session.json
          login_code=$(curl -sS -o login.json -w '%{http_code}' -c cookies.txt -H 'content-type: application/json' -X POST "$API/auth/login" --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          echo "login_http=$login_code"
          test "$login_code" = 200
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('login.json','utf8')); if(j.user?.username!=='$USERNAME') process.exit(1); console.log('login_user_verified=true')"
          login_session_code=$(curl -sS -o login-session.json -w '%{http_code}' -b cookies.txt "$API/auth/session")
          echo "session_after_login_http=$login_session_code"
          test "$login_session_code" = 200
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('login-session.json','utf8')); if(j.user?.username!=='$USERNAME') process.exit(1); console.log('login_session_persisted=true')"
          rm -f cookies.txt login.json login-session.json
