name: sphere-signup-diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnose users schema
        run: |
          cd worker
          npm install
          npx wrangler@4 d1 execute sphere --remote --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='users'"
          npx wrangler@4 d1 execute sphere --remote --command "PRAGMA table_info(users)"
