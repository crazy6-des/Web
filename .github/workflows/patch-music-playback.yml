name: patch music playback
on:
  push:
    branches: [fix/music-playback-across-users]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch playback proxy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker/src/index.ts')
          s=p.read_text()
          old="""if(path==='/music/search'&&req.method==='GET'){\nrequireAuth(a);"""
          new="""const musicStream=path.match(/^\\/music\\/stream\\/([^/]+)$/);\nif(musicStream&&req.method==='GET'){\n  const id=decodeURIComponent(musicStream[1]);\n  if(!id)return new Response(null,{status:400,headers:cors(env,req)});\n  const u=new URL(`https://discoveryprovider.audius.co/v1/tracks/${encodeURIComponent(id)}/stream`);\n  u.searchParams.set('app_name','sphere_social_rewards');\n  const headers=new Headers();\n  const range=req.headers.get('Range');\n  if(range)headers.set('Range',range);\n  const upstream=await fetch(u.toString(),{headers});\n  const out=new Headers(cors(env,req));\n  for(const k of ['content-type','content-length','content-range','accept-ranges','cache-control']){const v=upstream.headers.get(k);if(v)out.set(k,v);}\n  return new Response(upstream.body,{status:upstream.status,headers:out});\n}\nif(path==='/music/search'&&req.method==='GET'){\nrequireAuth(a);"""
          if old not in s: raise SystemExit('worker anchor not found')
          p.write_text(s.replace(old,new,1))

          p=Path('src/App.tsx')
          s=p.read_text()
          old="""const songUrl=post.song_url||post.music?.audio_url||post.music?.external_url||post.music_metadata?.audio_url||post.music_metadata?.external_url;"""
          new="""const audiusId=post.music?.provider==='audius'?post.music?.id:post.music_metadata?.provider==='audius'?post.music_metadata?.id:undefined;const songUrl=audiusId?`${base()}/music/stream/${encodeURIComponent(String(audiusId))}`:post.song_url||post.music?.audio_url||post.music?.external_url||post.music_metadata?.audio_url||post.music_metadata?.external_url;"""
          if old not in s: raise SystemExit('App anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate
        run: |
          npm install
          npm run check
          npm run build
          cd worker
          npm install
          npm run check
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/patch-music-playback.yml
          git add src/App.tsx worker/src/index.ts .github/workflows/patch-music-playback.yml
          git commit -m 'fix: make post music playable for every user'
          git push origin HEAD:fix/music-playback-across-users
