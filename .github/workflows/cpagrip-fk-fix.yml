name: cpagrip fk fix

on:
  push:
    branches: [cpagrip-fk-alignment]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck worker
        run: |
          npm install
          npm run check
        working-directory: worker
      - name: Run isolated CPAGrip regression
        run: |
          npx wrangler@4 d1 execute sphere-cpagrip-isolated-test --local --file=test/cpagrip-isolated.sql --config=wrangler.cpagrip-test.toml
          nohup npx wrangler@4 dev --local --config=wrangler.cpagrip-test.toml --ip 127.0.0.1 --port 8787 > /tmp/cpagrip-worker.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/api/earn/providers >/dev/null 2>&1; then break; fi
            sleep 2
          done
          node scripts/cpagrip-isolated-test.mjs
        working-directory: worker
      - name: Dump log on failure
        if: failure()
        run: cat /tmp/cpagrip-worker.log || true
