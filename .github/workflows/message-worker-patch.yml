name: patch-message-worker
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Patch worker routes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker/src/index.ts')
          s=p.read_text()
          marker="if(path==='/messages'&&req.method==='POST')"
          if "path==='/messages/with'" not in s:
            route="""if(path==='/messages/with'&&req.method==='GET'){requireAuth(a);const target=text(url.searchParams.get('user_id'));if(!target||target===a.user.id)return json({conversation_id:null},200,ch);if(await blocked(env,a.user.id,target)||await blocked(env,target,a.user.id))return json({conversation_id:null},200,ch);const pc=await columns(env.DB,'conversation_participants'),conv=first(pc,['conversation_id','conversation']),uc=first(pc,['user_id','participant_id']);if(!conv||!uc)return json({conversation_id:null},200,ch);const cid=text((await env.DB.prepare(`SELECT p1.${ident(conv)} AS cid FROM conversation_participants p1 JOIN conversation_participants p2 ON p1.${ident(conv)}=p2.${ident(conv)} WHERE p1.${ident(uc)}=? AND p2.${ident(uc)}=? LIMIT 1`).bind(a.user.id,target).first<Row>())?.cid);return json({conversation_id:cid||null},200,ch);}\n"""
            s=s.replace(marker,route+marker,1)
          marker2="if(path==='/messages'&&req.method==='GET')"
          if "path.match(/^\\/messages\\/([^/]+)$/)" not in s:
            route2="""const me=path.match(/^\\/messages\\/([^/]+)$/);if(me&&req.method==='PATCH'){requireAuth(a);const mid=requireId(decodeURIComponent(me[1]),'message id'),b=await body(),content=text(b.content).trim().slice(0,4000);if(!content)return json({error:'Message is required'},400,ch);const mc=await columns(env.DB,'messages'),ic=first(mc,['id','message_id']),sc=first(mc,['sender_id','user_id','from_user_id']),cc=first(mc,['content','body','message']);if(!ic||!sc||!cc)return json({error:'Messages unavailable'},503,ch);const row=await env.DB.prepare(`SELECT * FROM messages WHERE ${ident(ic)}=? LIMIT 1`).bind(mid).first<Row>();if(!row)return json({error:'Message not found'},404,ch);if(text(row[sc])!==a.user.id)return json({error:'Forbidden'},403,ch);await update(env.DB,'messages',`${ident(ic)}=?`,[mid],{[cc]:content,body:content,updated_at:now()});return json({ok:true},200,ch);}\n"""
            s=s.replace(marker2,route2+marker2,1)
          p.write_text(s)
          PY
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add worker/src/index.ts
            git commit -m 'fix: support message history and editing'
            git push origin HEAD:${{ github.head_ref }}
          fi
