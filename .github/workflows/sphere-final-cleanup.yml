name: sphere-final-cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sphere-final-cleanup.yml'
permissions:
  contents: write
jobs:
  clean-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore original password hashing parameters and remove incident workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/src/index.ts')
          s=p.read_text()
          if s.count('iterations:100000') != 1: raise SystemExit('expected one 100000 iteration value')
          s=s.replace('iterations:100000','iterations:210000',1)
          if s.count('return `100000$${salt}$${b64(bits)}`;') != 1: raise SystemExit('expected one 100000 hash marker')
          s=s.replace('return `100000$${salt}$${b64(bits)}`;','return `210000$${salt}$${b64(bits)}`;',1)
          p.write_text(s)
          for name in ['sphere-auth-secret-repair.yml','sphere-production-smoke.yml','sphere-session-schema-check.yml','sphere-secret-name-check.yml','sphere-final-cleanup.yml']:
            Path('.github/workflows',name).unlink(missing_ok=True)
          PY
      - name: Worker typecheck and clean deployment
        run: |
          npm install
          npm run check
          npx wrangler@4 deploy
        working-directory: worker
      - name: Commit clean final code and remove incident workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/index.ts .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore clean Sphere production configuration'
          git push origin HEAD:main
