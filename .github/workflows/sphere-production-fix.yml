name: sphere-production-fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sphere-production-fix.yml'
permissions:
  contents: write
jobs:
  fix-deploy-cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply smallest production fix and remove diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/src/index.ts')
          s=p.read_text()
          old='iterations:210000'
          if s.count(old) != 1:
              raise SystemExit(f'expected one PBKDF2 210000 occurrence, found {s.count(old)}')
          p.write_text(s.replace(old,'iterations:100000',1))
          for name in ['sphere-temporary-diagnostic-deploy.yml','sphere-d1-insert-probe.yml']:
              Path('.github/workflows',name).unlink(missing_ok=True)
          PY
      - name: Typecheck Worker
        run: |
          npm install
          npm run check
        working-directory: worker
      - name: Deploy clean Worker to existing sphere-api
        run: npx wrangler@4 deploy
        working-directory: worker
      - name: Commit and push clean fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/index.ts .github/workflows/sphere-temporary-diagnostic-deploy.yml .github/workflows/sphere-d1-insert-probe.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: cap Worker PBKDF2 at production runtime limit'
          git push origin HEAD:main
