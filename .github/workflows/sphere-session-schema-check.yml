name: sphere-session-schema-check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sphere-session-schema-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect existing session table only
        run: |
          cd worker
          npm install
          npx wrangler@4 d1 execute sphere --remote --command "PRAGMA table_info(user_sessions)"
