name: finalize-auth-fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-auth-fix.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align stored PBKDF2 iteration marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/src/index.ts')
          s=p.read_text()
          old='return `210000$${salt}$${b64(bits)}`;'
          new='return `100000$${salt}$${b64(bits)}`;'
          if s.count(old) != 1: raise SystemExit(f'expected one stored PBKDF2 marker, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Typecheck Worker
        run: |
          npm install
          npm run check
        working-directory: worker
      - name: Deploy clean Worker
        run: npx wrangler@4 deploy
        working-directory: worker
      - name: Commit clean auth fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/index.ts .github/workflows/finalize-auth-fix.yml
          git commit -m 'fix: align persisted PBKDF2 iteration marker' || true
          git push origin HEAD:main
