name: Patch embedded post music player
on:
  push:
    branches: [feat/embedded-post-music-player]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/embedded-post-music-player
      - name: Patch post music UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old="{songTitle&&<div className=\"music-line\">♫ {songUrl?<a href={songUrl} target=\"_blank\" rel=\"noreferrer\">{songTitle}{songArtist?` — ${songArtist}`:''}</a>:<span>{songTitle}{songArtist?` — ${songArtist}`:''}</span>}</div>}"
          new="{songTitle&&<div className=\"music-line\"><div className=\"music-meta\">♫ {songTitle}{songArtist?` — ${songArtist}`:''}</div>{songUrl&&<audio className=\"post-music-player\" controls preload=\"none\" src={songUrl} aria-label={`Play ${songTitle}${songArtist?` by ${songArtist}`:''}`}>Your browser does not support audio playback.</audio>}</div>}"
          if old not in s: raise SystemExit('App.tsx music block anchor not found')
          p.write_text(s.replace(old,new,1))
          p=Path('src/styles.css')
          s=p.read_text()
          anchor=''
          addition='''\n.music-line { margin: 12px 0 4px; }\n.music-meta { margin-bottom: 8px; font-weight: 600; }\n.post-music-player { display: block; width: 100%; max-width: 520px; height: 42px; }\n'''
          if '.post-music-player' not in s:
              p.write_text(s+addition)
          PY
      - name: Validate
        run: |
          npm install
          npm run check
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/styles.css .github/workflows/patch-embedded-music.yml
          git commit -m 'feat: embed music player in posts'
          git push origin HEAD:feat/embedded-post-music-player
