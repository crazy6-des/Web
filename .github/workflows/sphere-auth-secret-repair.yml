name: sphere-auth-secret-repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sphere-auth-secret-repair.yml'
permissions:
  contents: read
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create missing Worker JWT secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          JWT_SECRET="$(openssl rand -hex 48)"
          JWT_REFRESH_SECRET="$(openssl rand -hex 48)"
          printf '%s' "$JWT_SECRET" | (cd worker && npx wrangler@4 secret put JWT_SECRET)
          printf '%s' "$JWT_REFRESH_SECRET" | (cd worker && npx wrangler@4 secret put JWT_REFRESH_SECRET)
      - name: Deploy clean Worker code
        run: |
          cd worker
          npm install
          npm run check
          npx wrangler@4 deploy
      - name: Verify required JWT secret names are now present
        run: |
          cd worker
          npx wrangler@4 secret list
      - name: Run one real production signup and verify D1 persistence
        run: |
          set -euo pipefail
          API_BASE="$(sed -n 's/.*VITE_API_BASE_URL = "\(.*\)"/\1/p' netlify.toml)"
          export API_BASE
          cd worker
          npm install
          node --input-type=module <<'NODE'
          const base = process.env.API_BASE.replace(/\/$/, '');
          const id = process.env.GITHUB_RUN_ID;
          const username = `incident${id}`;
          const email = `incident-${id}@example.invalid`;
          const password = `SphereIncident-${id}-Safe!`;
          const r = await fetch(`${base}/auth/signup`, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({username,email,password})});
          const text = await r.text();
          let body; try { body=JSON.parse(text); } catch { body=text; }
          console.log(JSON.stringify({status:r.status,body,username}));
          await import('node:fs/promises').then(fs=>fs.writeFile('/tmp/signup-status',String(r.status)));
          await import('node:fs/promises').then(fs=>fs.writeFile('/tmp/signup-username',username));
          NODE
          STATUS="$(cat /tmp/signup-status)"
          USERNAME="$(cat /tmp/signup-username)"
          npx wrangler@4 d1 execute sphere --remote --command "SELECT id,username,role,status FROM users WHERE username='$USERNAME'"
          test "$STATUS" = "201"
