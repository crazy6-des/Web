name: Sphere isolated frontend validation

on:
  push:
    branches: [cpagrip-isolated]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Typecheck
        run: npm run check
      - name: Production build
        run: npm run build
