name: sphere-temporary-diagnostic-deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add temporary safe signup diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/src/index.ts')
          s=p.read_text()
          old="catch(e){const status=Number((e as any)?.status)||500;return json({error:status===401?'Authentication required':status<500?text((e as any)?.message):'Internal server error'},status,cors(env,req));}"
          new="catch(e){try{const er=e as any;const raw=er instanceof Error?er.message:String(er??'');const safe=raw.replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}/g,'[redacted-email]').replace(/[A-Fa-f0-9]{32,}/g,'[redacted-token]').slice(0,300);console.error('sphere_error',JSON.stringify({path:new URL(req.url).pathname,error_name:er?.name||'Error',error_message:safe}));if(new URL(req.url).pathname==='/auth/signup')return json({error:'DIAGNOSTIC:'+safe},500,cors(env,req));}catch{}const status=Number((e as any)?.status)||500;return json({error:status===401?'Authentication required':status<500?text((e as any)?.message):'Internal server error'},status,cors(env,req));}"
          if old not in s: raise SystemExit('target catch not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Deploy diagnostic Worker
        run: |
          cd worker
          npm install
          npm run check
          npx wrangler@4 deploy
