name: sphere-d1-insert-probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sphere-d1-insert-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe existing users insert contract
        run: |
          cd worker
          npm install
          npx wrangler@4 d1 execute sphere --remote --command "INSERT INTO users (id,email,username,password_hash,role,status,created_at,updated_at) VALUES ('d1-probe-${GITHUB_RUN_ID}','d1-probe-${GITHUB_RUN_ID}@example.invalid','d1probe${GITHUB_RUN_ID}','diagnostic-hash','USER','ACTIVE',datetime('now'),datetime('now'))"
          npx wrangler@4 d1 execute sphere --remote --command "DELETE FROM users WHERE id='d1-probe-${GITHUB_RUN_ID}'"
